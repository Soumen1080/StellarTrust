[workspace]
resolver = "2"
members = ["escrow", "rwa_token"]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# Pinned to match the platform toolchain: Stellar CLI 27 (protocol 23) and
# rustc >= 1.91. SDK 22.x fails to compile on modern rustc (soroban-env-common
# E0119 conflicting TryFrom impls), which blocked CI and deployment.
soroban-sdk = "27.0.2"

# Optimize WASM output for on-chain deployment.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
strip = "symbols"
codegen-units = 1
lto = true
panic = "abort"
