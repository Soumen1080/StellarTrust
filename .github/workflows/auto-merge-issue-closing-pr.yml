name: Auto merge issue-closing PRs

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge qualifying pull requests
        uses: actions/github-script@v7
        with:
          script: |
            const closingPattern = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#\d+\b/i;
            const run = context.payload.workflow_run;
            const prs = run.pull_requests || [];

            if (prs.length === 0) {
              core.info('No pull requests are attached to this workflow run.');
              return;
            }

            for (const prRef of prs) {
              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prRef.number,
              });

              if (pr.state !== 'open' || pr.draft) {
                core.info(`Skipping PR #${pr.number}: not open or still draft.`);
                continue;
              }

              if (pr.head.sha !== run.head_sha) {
                core.info(`Skipping PR #${pr.number}: workflow run is for an older commit.`);
                continue;
              }

              if (!closingPattern.test(pr.body || '')) {
                core.info(`Skipping PR #${pr.number}: description has no close/fix/resolve #issue reference.`);
                continue;
              }

              try {
                await github.rest.pulls.merge({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                });
                core.info(`Merged PR #${pr.number}.`);
              } catch (error) {
                core.warning(`Could not merge PR #${pr.number}: ${error.message}`);
              }
            }
